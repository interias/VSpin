; Inselfahrt – Konfiguration (ConfigFile/INI). Werte ändern das Fahrgefühl ohne Codeänderung.
; Fehlende Schlüssel fallen auf die eingebauten Standardwerte zurück (src/ride_config.gd).

[bus]
; Adresse des Bus (docs/bus-protocol.md).
url="ws://127.0.0.1:8765"
; Sekunden bis zum nächsten Verbindungsversuch nach Abbruch/Fehlschlag.
reconnect_s=2.0
; Sekunden, nach denen ein hängender Verbindungsaufbau abgebrochen und neu versucht wird.
connect_timeout_s=5.0

[bridge]
; Bridge aus dem Spiel starten (nur Windows): Ist beim Start keine Bridge auf 127.0.0.1:8765 erreichbar, startet das
; Spiel sie unsichtbar (ohne Konsolenfenster) und beendet sie beim Schließen sauber. Eine schon laufende Bridge
; (z. B. von Hand im Kommandofenster gestartet) wird nur mitbenutzt. false = Bridge immer von Hand starten.
autostart=true
; Python ohne Konsolenfenster aus dem venv der Bridge (startet `-m vspin_bridge`). Relative Pfade gelten ab dem
; Spielordner games/island-ride (im Export: Ordner der .exe).
program="../../bridge/.venv/Scripts/pythonw.exe"
; Quelle: "sim" (Simulator) oder "ble" (Trainer per Bluetooth – welcher, legt das Verbindungsfenster fest; ohne
; gemerkten Trainer öffnet es beim Start von selbst).
source="sim"
; Start-Kadenz des Simulators in rpm (nur bei source="sim"; ohne Terminal gibt es keine Pfeiltasten).
sim_cadence=80
; Ablage der Session-Dateien (CSV + Rohdaten).
sessions_dir="../../bridge/sessions"
; Trainer nur lesen (nur bei source="ble"): true = die Bridge fordert keine Steuerung an und schreibt nichts auf den
; Trainer (`--read-only`), z. B. wenn Zwift ihn steuert; die Steigung wirkt dann nur im Spiel. false = VSpin steuert
; den Widerstand, sofern der Trainer Indoor Bike Simulation kann.
trainer_read_only=false

[companion]
; Python ohne Konsolenfenster aus dem eigenen venv des Begleiters Toni (startet `-m vspin_companion`; Installation in
; bridge/README.md). Nicht das venv der Bridge: Dessen Pakete reichen für Toni nicht, er würde heiser. Relative Pfade
; gelten ab dem Spielordner games/island-ride (im Export: Ordner der .exe). Fehlt das Programm, startet kein Begleiter.
program="../../bridge/.venv-companion/Scripts/pythonw.exe"

[ride]
; Übersetzungsfaktor k: Zielgeschwindigkeit in km/h je rpm auf flacher Strecke (90 rpm * 0.33 ≈ 30 km/h).
k_kmh_per_rpm=0.33
; Dämpfung bergauf: v_ziel wird durch (1 + uphill_damping * Steigung) geteilt (6 % bei 8.0 → ×0.68).
uphill_damping=8.0
; Verstärkung bergab: v_ziel wird mit (1 + downhill_boost * |Gefälle|) multipliziert (−6 % bei 2.0 → ×1.12).
downhill_boost=2.0
; Trägheit: Zeitkonstante in Sekunden, nach der 63 % des Wegs zur Zielgeschwindigkeit erreicht sind (0 = sofort).
inertia_s=1.5

[gears]
; Virtuelle Gänge (Tasten Pfeil ↑/↓, Ziffernblock +/−; nur mit steuerbarem Trainer): effektive Steigung = Strecke +
; (Gang − neutral) × step_pp. Höherer Gang = schwerer. Jede Fahrt beginnt im neutralen Gang.
count=24
neutral=12
; Prozentpunkte Steigung je Gang (0.5 = Meldeschwelle des Widerstands, jeder Schritt wird gesendet).
step_pp=0.5

[power]
; Leistungsmodell: Liefert der Trainer gemessene Watt, ergibt sich das Tempo aus Leistung, Streckensteigung, Masse,
; Rollwiderstand und Luftwiderstand (ohne Wind); sonst (Simulator) gilt [ride]. Die Gänge wirken hier nicht, nur auf den
; Widerstand am Trainer. Trägheit wie [ride] inertia_s.
; Gesamtmasse Fahrer + Rad in kg (75 + 10).
mass_kg=85.0
; Luftwiderstandsfläche CdA in m² (0.32 = aufrecht am Oberlenker, 0.25 = Unterlenker).
cda_m2=0.32
; Rollwiderstandsbeiwert (0.004 = gute Straßenreifen auf Asphalt).
crr=0.004
; Luftdichte in kg/m³ (1.225 = Meereshöhe, 15 °C).
air_density=1.225
; Höchsttempo in km/h – begrenzt nur steile Abfahrten.
max_kmh=70.0

[world]
; Strecke: "island" = Insel-Rundkurs (~9,2 km, Standard), "graybox" = kurze Graybox-Teststrecke (~900 m).
track="island"

[camera]
; Kameraperspektiven (#59, Taste C / Grafikmenü): Nah und Verfolger (Standard) sind fest (src/camera_views.gd);
; behind_m und height_m sind die Perspektive „Weit“, look_ahead_m und look_height_m gelten für alle drei.
; „Weit“: Abstand hinter dem Fahrer entlang der Strecke (m) – kleiner = Fahrer größer im Bild.
behind_m=5.5
; „Weit“: Höhe der Kamera über der Strecke (m); mindestens 1,5 m über dem Gelände.
height_m=2.4
; Blickpunkt: so viele Meter voraus auf der Strecke …
look_ahead_m=10.0
; … und so hoch über der Strecke (m).
look_height_m=1.2

[sky]
; Tag/Nacht und Wetter (src/sky_controller.gd). Tageszeit = echte Ortszeit auf Mallorca (MEZ/MESZ), Sonnenstand
; nach Datum und Uhrzeit für Palma. time_mode: "realtime" (Echtzeit, Standard), "fixed" (feste Ortszeit fixed_hour),
; "timelapse" (Zeitraffer: ein Tag in timelapse_day_min Minuten echter Zeit).
time_mode="realtime"
; Ortszeit in Stunden (0–24, z. B. 21.5 = 21:30) für time_mode="fixed".
fixed_hour=13.0
timelapse_day_min=24.0
; Wetter ist simuliert (kein Online-Wetter). weather_mode: "changing" (wechselnd, meist sonnig, Übergänge über
; Minuten; Standard) oder "fixed" (bleibt bei weather). weather: Anfangs-/festes Wetter – "clear" (klar),
; "light_clouds" (leicht bewölkt), "overcast" (bewölkt/dunstig), "rain" (leichter Regen).
weather_mode="changing"
weather="clear"
