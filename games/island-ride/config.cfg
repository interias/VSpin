; Inselfahrt – Konfiguration (ConfigFile/INI). Werte ändern das Fahrgefühl ohne Codeänderung.
; Fehlende Schlüssel fallen auf die eingebauten Standardwerte zurück (src/ride_config.gd).

[bus]
; Adresse des Bus (docs/bus-protocol.md).
url="ws://127.0.0.1:8765"
; Sekunden bis zum nächsten Verbindungsversuch nach Abbruch/Fehlschlag.
reconnect_s=2.0
; Sekunden, nach denen ein hängender Verbindungsaufbau abgebrochen und neu versucht wird.
connect_timeout_s=5.0

[ride]
; Übersetzungsfaktor k: Zielgeschwindigkeit in km/h je rpm auf flacher Strecke (90 rpm * 0.33 ≈ 30 km/h).
k_kmh_per_rpm=0.33
; Dämpfung bergauf: v_ziel wird durch (1 + uphill_damping * Steigung) geteilt (6 % bei 8.0 → ×0.68).
uphill_damping=8.0
; Verstärkung bergab: v_ziel wird mit (1 + downhill_boost * |Gefälle|) multipliziert (−6 % bei 2.0 → ×1.12).
downhill_boost=2.0
; Trägheit: Zeitkonstante in Sekunden, nach der 63 % des Wegs zur Zielgeschwindigkeit erreicht sind (0 = sofort).
inertia_s=1.5

[world]
; Strecke: "island" = Insel-Rundkurs (~9,2 km, Standard), "graybox" = kurze Graybox-Teststrecke (~900 m).
track="island"

[sky]
; Tag/Nacht und Wetter (src/sky_controller.gd). Tageszeit = echte Ortszeit auf Mallorca (MEZ/MESZ), Sonnenstand
; nach Datum und Uhrzeit für Palma. time_mode: "realtime" (Echtzeit, Standard), "fixed" (feste Ortszeit fixed_hour),
; "timelapse" (Zeitraffer: ein Tag in timelapse_day_min Minuten echter Zeit).
time_mode="realtime"
; Ortszeit in Stunden (0–24, z. B. 21.5 = 21:30) für time_mode="fixed".
fixed_hour=13.0
timelapse_day_min=24.0
; Wetter ist simuliert (kein Online-Wetter). weather_mode: "changing" (wechselnd, meist sonnig, Übergänge über
; Minuten; Standard) oder "fixed" (bleibt bei weather). weather: Anfangs-/festes Wetter – "clear" (klar),
; "light_clouds" (leicht bewölkt), "overcast" (bewölkt/dunstig), "rain" (leichter Regen).
weather_mode="changing"
weather="clear"
