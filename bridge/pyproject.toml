[project]
name = "vspin-bridge"
version = "0.0.0"
description = "BLE-Bridge für das Wenoker JC312 – Telemetrie auf einen lokalen WebSocket-Bus"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "websockets>=13",  # neue asyncio-API (websockets.asyncio.server)
    "bleak",           # BLE-Quelle (Folgeticket)
]

[project.optional-dependencies]
test = ["pytest"]
# Begleiter (vspin-companion): Abhängigkeiten der echten Adapter (Claude Agent SDK, faster-whisper, Audio) –
# nur dort importiert; #78/#79 füllen das Extra. Tests laufen mit Fakes ohne es.
companion = []

[project.scripts]
vspin-bridge = "vspin_bridge.cli:main"
vspin-companion = "vspin_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vspin_bridge", "src/vspin_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
