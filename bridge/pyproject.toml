[project]
name = "vspin-bridge"
version = "0.0.0"
description = "BLE-Bridge für das Wenoker JC312 – Telemetrie auf einen lokalen WebSocket-Bus"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "websockets>=13",  # neue asyncio-API (websockets.asyncio.server)
    "bleak",           # BLE-Quelle (Folgeticket)
]

[project.optional-dependencies]
test = ["pytest"]
# Begleiter (vspin-companion): Abhängigkeiten der echten Adapter (Claude Agent SDK, faster-whisper, Audio) –
# nur dort importiert, nie beim Import von vspin_companion und nie in Tests (die laufen mit Fakes ohne das Extra).
# Nicht enthalten: die CUDA-Bibliotheken (nvidia-cublas-cu12, nvidia-cudnn-cu12 9.x, etwa 1,3 GB) – siehe README.
companion = [
    "claude-agent-sdk>=0.2.174",  # Brain (#78, ADR-0011)
    "faster-whisper>=1.2.1",      # Ears (#79): zieht ctranslate2, onnxruntime (VAD), av (MP3 dekodieren), tokenizers
    "sounddevice>=0.5.6",         # Ears/Mouth (#79): Mikrofon und Wiedergabe über PortAudio (Windows-Standardgerät)
]

[project.scripts]
vspin-bridge = "vspin_bridge.cli:main"
vspin-companion = "vspin_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vspin_bridge", "src/vspin_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
